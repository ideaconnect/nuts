version: 2

project_name: nuts

builds:
  - id: caddy-nuts
    main: ./cmd/caddy
    binary: caddy
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/caddyserver/caddy/v2.CustomVersion={{.Version}}

archives:
  - id: default
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        formats: zip
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md
      - Caddyfile

sboms:
  - artifacts: archive

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

# Cosign keyless signs the checksum manifest so downstream verifiers
# can `cosign verify-blob --certificate ... --signature ... checksums.txt`
# to bind every artifact in the release to a sigstore identity. Without
# this, an attacker who compromised GITHUB_TOKEN (or who raced the
# Release upload step before the per-ref concurrency guard in
# release.yml landed) could swap an archive and republish a matching
# unsigned manifest undetected. ci.yml already runs cosign keyless
# against the docker image, so the same primitive applies here.
# Requires `id-token: write` on release.yml's permissions block so the
# OIDC token is available to cosign.
signs:
  - cmd: cosign
    artifacts: checksum
    signature: ${artifact}.sig
    certificate: ${artifact}.pem
    args:
      - sign-blob
      - --yes
      - --oidc-issuer=https://token.actions.githubusercontent.com
      - --output-signature=${signature}
      - --output-certificate=${certificate}
      - ${artifact}

snapshot:
  version_template: "{{ .Tag }}-next"

changelog:
  use: github
  sort: asc
  groups:
    - title: Features
      regexp: "^.*feat[(\\w)]*:+.*$"
      order: 0
    - title: Bug fixes
      regexp: "^.*fix[(\\w)]*:+.*$"
      order: 1
    - title: Others
      order: 999
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "Merge pull request"
      - "Merge branch"

release:
  github:
    owner: ideaconnect
    name: nuts
  draft: false
  prerelease: auto
  name_template: "NUTS {{.Version}}"
  header: |
    ## NUTS {{ .Version }}

    A pre-built Caddy binary that includes the `nuts` NATS-to-SSE handler.
    See [CHANGELOG.md](CHANGELOG.md) for the full list of changes.
  footer: |
    ---
    Docker image: `docker pull idcttech/nuts:{{ .Version }}`
