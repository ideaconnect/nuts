name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  # Required by cosign keyless signing (sign-blob over checksums.txt
  # via the signs: block in .goreleaser.yml). Without it the OIDC
  # token is not available and goreleaser's signing step fails.
  id-token: write

# Serialize releases per ref so a tag-delete + re-push recovery (a
# common changelog-fix pattern) can't race two goreleaser jobs over the
# same dist/ directory and GH Release assets. cancel-in-progress: false
# is deliberate — a second run queues rather than tearing down a
# partial publish mid-upload.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Check GoReleaser config
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          # Pinned to an exact version (was '~> v2'). Matches the
          # convention used by the rest of the supply-chain tooling.
          # Bump in lockstep with ci.yml's snapshot job so PR and
          # tagged release exercise the same goreleaser surface.
          version: 'v2.16.0'
          args: check

      - name: Install Syft for GoReleaser SBOMs
        uses: anchore/sbom-action/download-syft@v0

      - name: Install Cosign for checksum signing
        uses: sigstore/cosign-installer@v3
        with:
          # Pin cosign itself, not just the installer action. The rest
          # of the supply-chain tooling pins tightly (golangci-lint
          # v2.11.4, govulncheck v1.1.4, trivy 0.59.1) so a behavioural
          # change in a new cosign minor (e.g. flag rename in
          # sign-blob, OIDC issuer URL handling) cannot land mid-
          # release. Bump in lockstep with the other tools.
          cosign-release: 'v2.6.3'

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: 'v2.16.0'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
