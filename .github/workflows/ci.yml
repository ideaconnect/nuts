name: CI

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Check gofmt
        run: |
          fmt_out=$(gofmt -l .)
          if [ -n "$fmt_out" ]; then
            echo "The following files are not gofmt-clean:"
            echo "$fmt_out"
            exit 1
          fi

      - name: Check go mod tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.4

      - name: Run unit tests with coverage
        run: go test -covermode=atomic -coverprofile=coverage.out -v -timeout 120s .

      # Run the full unit suite under -race rather than a hand-picked
      # subset. The previous approach allowlisted only three tests, so
      # any race introduced outside that allowlist landed silently.
      - name: Run unit tests with -race (full package)
        run: go test -race -timeout 240s .

      - name: Print coverage summary
        run: go tool cover -func=coverage.out

      - name: Run go vet
        run: go vet ./...

      - name: Run govulncheck
        # Pinned to match the rest of CI (golangci-lint, trivy, action SHAs).
        # Bump in lockstep with Renovate/Dependabot updates.
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

      - name: Run functional test matrix
        env:
          TEST_BASE_URL: http://localhost:8080
          TEST_NATS_URL: nats://localhost:4222
          NATS_COMPAT_IMAGES: nats:2.9-alpine nats:2.12-alpine nats:2.14-alpine
        run: make test-functional-matrix

      - name: Run functional test stress pass
        env:
          TEST_BASE_URL: http://localhost:8080
          TEST_NATS_URL: nats://localhost:4222
          NATS_IMAGE: nats:2.12-alpine
        run: make test-functional-stress FUNCTIONAL_TEST_STRESS_COUNT=3

      # One functional pass under the race detector against the newest
      # NATS image. Catches broker-timing-dependent data races (slow-
      # client pacing, dispatch backpressure) that the root-package -race
      # step can't see because they only manifest against a real broker.
      # Not in the matrix or stress count — -race ~doubles wall clock and
      # the additional incremental signal is small.
      - name: Run functional suite under -race
        env:
          TEST_BASE_URL: http://localhost:8080
          TEST_NATS_URL: nats://localhost:4222
          NATS_IMAGE: nats:2.12-alpine
          FUNCTIONAL_TEST_RACE: '1'
        run: make test-functional

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          files: ./coverage.out
          flags: unittests
          name: unit-tests
          fail_ci_if_error: false
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}


  docker-build:
    needs: test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build production image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: idcttech/nuts:ci

      - name: Validate production Caddyfile in image
        run: docker run --rm idcttech/nuts:ci /app/caddy adapt --config /app/Caddyfile

      - name: Scan production image for vulnerabilities
        run: |
          mkdir -p "$HOME/.cache/trivy"
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$HOME/.cache/trivy:/root/.cache" \
            aquasec/trivy:0.59.1 image \
            --exit-code 1 \
            --ignore-unfixed \
            --severity HIGH,CRITICAL \
            idcttech/nuts:ci

      - name: Generate production image SBOM
        uses: anchore/sbom-action@v0
        with:
          image: idcttech/nuts:ci
          format: spdx-json
          output-file: nuts-image.spdx.json

      - name: Upload production image SBOM
        uses: actions/upload-artifact@v7
        with:
          name: nuts-image-sbom
          path: nuts-image.spdx.json

  goreleaser-snapshot:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Syft for GoReleaser SBOMs
        uses: anchore/sbom-action/download-syft@v0

      - name: Detect release configuration changes
        id: release_changes
        uses: dorny/paths-filter@v4
        with:
          filters: |
            release:
              - '.goreleaser.yml'
              - '.github/workflows/release.yml'
              - '.github/workflows/ci.yml'
              - 'Makefile'
              - 'Dockerfile'

      - name: Check GoReleaser config
        if: steps.release_changes.outputs.release == 'true'
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          # Pinned to an exact version (was '~> v2'). Matches the
          # convention used by the rest of the supply-chain tooling
          # (golangci-lint v2.11.4, govulncheck v1.1.4, trivy 0.59.1,
          # cosign v2.4.1). Bump in lockstep with release.yml so PR
          # snapshot and tagged release exercise the same goreleaser
          # surface.
          version: 'v2.16.0'
          args: check

      - name: Run GoReleaser snapshot dry run
        if: steps.release_changes.outputs.release == 'true'
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: 'v2.16.0'
          # --skip=sign on the PR snapshot: the snapshot job has no
          # `id-token: write` permission, so cosign keyless via the
          # .goreleaser.yml `signs:` block would fail with "no OIDC
          # token". The docker-image signing path is exercised
          # separately by the `docker` job, and the release.yml
          # workflow exercises the full signs: pipe on tag push.
          # Without this flag the snapshot job either fails or
          # silently uses whatever cosign happens to be on the runner
          # — the same cross-workflow drift the cosign pin and the
          # version pin above were meant to prevent.
          args: release --snapshot --clean --skip=publish --skip=sign

  docker:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: idcttech/nuts
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag

      # Pre-push gate: build the amd64 image locally (`load: true`) and
      # scan it BEFORE the multi-arch push. Mirrors the closed-window
      # pattern already used by the PR-only `docker-build` job above.
      # The amd64 build is enough to catch the base-image CVE classes
      # (Alpine/Caddy/musl/static-Go-binary) because they're
      # arch-independent; the post-push scan on the multi-arch digest
      # stays as defense-in-depth for arm64 audit. Without this gate,
      # a fresh HIGH/CRITICAL CVE in the base layer would publish
      # `idcttech/nuts:latest` to Docker Hub for any `docker pull`
      # between the push step and the post-push Trivy failure — a
      # silent publish-then-revoke window that a failed scan does not
      # actually close (Docker Hub keeps the pushed tag).
      - name: Build amd64 image locally for pre-push scan
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          platforms: linux/amd64
          tags: idcttech/nuts:prepush-scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image for vulnerabilities before pushing to Docker Hub
        run: |
          mkdir -p "$HOME/.cache/trivy"
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$HOME/.cache/trivy:/root/.cache" \
            aquasec/trivy:0.59.1 image \
            --exit-code 1 \
            --ignore-unfixed \
            --severity HIGH,CRITICAL \
            idcttech/nuts:prepush-scan

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Scan pushed image for vulnerabilities
        # Run on every push-built image (including the :latest tag promoted
        # from main), not only release tags. A new HIGH/CRITICAL CVE in the
        # base image (Alpine, Caddy) can land between PR merge and the next
        # tag — Trivy previously caught Caddy CVE-2026-45135 only because
        # the PR-job scan ran, but the push-to-main job was gated on tags
        # and silently shipped unscanned :latest images for hours/days.
        run: |
          mkdir -p "$HOME/.cache/trivy"
          docker run --rm \
            -v "$HOME/.cache/trivy:/root/.cache" \
            aquasec/trivy:0.59.1 image \
            --exit-code 1 \
            --ignore-unfixed \
            --severity HIGH,CRITICAL \
            "idcttech/nuts@${{ steps.build.outputs.digest }}"

      - name: Install Cosign
        if: startsWith(github.ref, 'refs/tags/v')
        uses: sigstore/cosign-installer@v3
        with:
          # Match the pin in release.yml so both signing surfaces
          # (docker image here, checksums.txt in release.yml) use the
          # same cosign binary version.
          cosign-release: 'v2.4.1'

      - name: Sign release image
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          images=""
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            images="$images $tag@$DIGEST"
          done <<EOF
          $TAGS
          EOF
          cosign sign --yes $images
