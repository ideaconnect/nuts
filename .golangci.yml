version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - revive
    - gocritic
  settings:
    revive:
      rules:
        - name: var-naming
        - name: exported
          disabled: true
    gocritic:
      disabled-checks:
        - ifElseChain
        - singleCaseSwitch
  exclusions:
    generated: lax
    paths:
      - ^example/
      - ^example_docker/
      - ^functional_test/
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - gocritic
          - revive

formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - ^example/
      - ^example_docker/
      - ^functional_test/
